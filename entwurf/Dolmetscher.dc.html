<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    a { color: #7ba4f5; } a:hover { color: #a8c3fa; }
    .titelzeile { font-size: 11px; font-weight: 650; letter-spacing: .1em;
                  text-transform: uppercase; color: #a1a1aa; }
    .zahl { font-variant-numeric: tabular-nums; }
    .karte { background: #18181b; border: 1px solid #3f3f46; border-radius: 14px; padding: 14px 16px; }
  </style>
</helmet>

<!-- Dunkel, weil die Kabine dunkel ist. Grosse Schrift, weil der Blick
     zwischen Redner und Schirm springt. -->
<div style="width: 393px; height: 852px; display: flex; flex-direction: column; gap: 12px;
            padding: 28px 18px 22px; background: #0b0b0d; color: #fafafa; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; flex: none;">
    <span style="font-size: 16px; font-weight: 650;">Dolmetscherplatz</span>
    <span style="display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: #a1a1aa;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #3fbc6d;"></span>verbunden</span>
  </div>

  <div class="karte" style="border-color: #c8102e; box-shadow: inset 0 0 0 1px #c8102e; flex: none;">
    <div class="titelzeile" style="color: #f0576a;">Original — spricht jetzt</div>
    <div style="font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em;
                margin-top: 8px;">Ida Peters</div>
    <div class="zahl" style="color: #a1a1aa; font-size: 14px; margin-top: 5px;">
      Platz 4 · Delegierte · seit 01:12</div>
  </div>

  <div class="karte" style="flex: none;">
    <div class="titelzeile">Tagesordnungspunkt</div>
    <div style="font-size: 15px; font-weight: 550; margin-top: 6px;">4 · Feststellung des Jahresabschlusses 2026</div>
  </div>

  <div class="karte" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
    <div class="titelzeile" style="margin-bottom: 6px;">Als Nächstes</div>
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{liste}}" as="e" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #27272a;">
          <span class="zahl" style="width: 16px; color: #71717a; font-weight: 700;">{{e.nr}}</span>
          <span style="flex: 1; font-size: 15px;">{{e.name}}</span>
          <span style="font-size: 12px; color: {{e.farbe}};">{{e.lage}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Abgeschaltet, weil das System noch keinen Ton führt. Der Platz dafür
       steht trotzdem hier, damit die Anordnung später stimmt. -->
  <div class="karte" style="flex: none; opacity: .45;">
    <div class="titelzeile">Ausgabekanal</div>
    <div style="display: flex; gap: 8px; margin-top: 9px;">
      <div style="flex: 1; height: 46px; display: flex; align-items: center; justify-content: center;
                  border: 1px solid #3f3f46; border-radius: 10px; background: #27272a; font-weight: 600;">DE</div>
      <div style="flex: 1; height: 46px; display: flex; align-items: center; justify-content: center;
                  border: 1px solid #3f3f46; border-radius: 10px; background: #27272a; font-weight: 600;">EN</div>
      <div style="flex: 1; height: 46px; display: flex; align-items: center; justify-content: center;
                  border: 1px solid #3f3f46; border-radius: 10px; background: #27272a; font-weight: 600;">FR</div>
    </div>
    <div style="font-size: 12px; color: #a1a1aa; margin-top: 9px;">
      Kein Ton im System — der Platz zeigt heute nur, wer spricht.</div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      liste: [
        { nr: '2', name: 'Jonas Öztürk', lage: 'gemeldet', farbe: '#7ba4f5' },
        { nr: '3', name: 'Nadja Simon', lage: 'gemeldet', farbe: '#7ba4f5' },
        { nr: '—', name: 'Anke Bergmann', lage: 'Leitung', farbe: '#71717a' },
        { nr: '—', name: 'Rita Falk', lage: 'Schriftführung', farbe: '#71717a' },
      ],
    };
  }
}
</script>
</body>
</html>
