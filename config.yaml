datenbank: postgres://sitzung:geheim@localhost:5432/sitzung?sslmode=disable
adresse: ":8080"
saal_datei: saal.json
sitzungs_datei: sitzung.json
# Reserve aus dem Ring-out in dB. Gesetzt: die Höchstzahl offener Mikrofone
# folgt aus ihr (jede Verdopplung kostet 3 dB), und eine höhere Höchstzahl
# wird beim Start abgewiesen. Null oder weggelassen: die Höchstzahl unten
# ist gesetzt, nicht gemessen — der Vorabcheck weist darauf hin.
# einmessung_reserve_db: 9
max_offene_mikrofone: 3
kamera_zeitlimit_ms: 500

# Siegel: die Ereigniskette wird taeglich zu dieser Ortszeit und beim
# Herunterfahren abgeschlossen und unterschrieben. Der Schluessel wird beim
# ersten Start angelegt; der oeffentliche Teil liegt daneben als .pub und darf
# weitergegeben werden.
siegel_schluessel: schluessel/kette.key
siegel_uhrzeit: "23:55"
